<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPIN</title>
  <link rel="stylesheet" href="design.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
  <section class="page-section">
    <header class="admin-header">
      <aside><img src="TAPIN Logo.png" style="height:100px; position:relative; margin-left: 10px;" alt="TAPIN Logo" class="tapin-logo-img" /></aside>
        
      <div class="theme-controls">
        <button id="lightMode" class="theme-btn active" aria-label="Light Mode">
          <i class="fa-solid fa-sun"></i>
        </button>
        <button id="darkMode" class="theme-btn" aria-label="Dark Mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <aside class="sidebar">
      <button class="hamburger-tab" aria-label="Toggle menu">
        <span class="hamburger">
          <i></i><i></i><i></i>
        </span>
      </button>
      
      <nav class="side-nav">
      <a class="side-link" href="head account.html">
        <span class="ico"><i class="fa-solid fa-circle-user"></i></span>
        <span class="link-text">Account</span>
      </a>
      <a class="side-link active" href="head audit logs.html">
        <span class="ico"><i class="fa-solid fa-chart-column"></i></span>
        <span class="link-text">Audit Logs</span>
      </a>
      <a class="side-link side-logout" href="head login.html">
        <span class="ico"><i class="fa-solid fa-right-from-bracket"></i></span>
        <span class="link-text">Log out</span>
      </a>
      </nav>
    </aside>

    <section class="auditlogs-section">

  <div class="dash-header">
    <h1 class="audit-title">Audit Logs</h1>
  </div>

  <div class="auditlogs-content">
    
    <div class="audit-controls">
      
      <div class="control-wrapper date-control-wrapper">
        <button id="dateBtn" class="control-btn date-btn" type="button">
          <span id="dateBtnText">SELECT DATE</span>
          <i id="calIcon" class="fa-regular fa-calendar-days cal-icon"></i>
        </button>

        <div id="calendarPopover" class="calendar-popover hidden">
          <div class="cal-header">
            <label>Select Date</label>
            <input type="text" id="dateRangeInput" value="14 Oct 2026 - 17 Oct 2026" readonly class="cal-range-input">
          </div>
          <div class="cal-grid">
            <div class="cal-month-nav">
              <select id="calMonthSelect" class="cal-select">
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9" selected>October</option>
                <option value="10">November</option>
                <option value="11">December</option>
              </select>

              <select id="calYearSelect" class="cal-select">
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
              </select>
            </div>
            <div class="cal-days-mock">
              <div class="cal-row header"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
              <div class="cal-row"><span>29</span><span>30</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
              <div class="cal-row"><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span></div>
              <div class="cal-row"><span>13</span><span class="day-num">14</span><span class="day-num">15</span><span class="day-num">16</span><span class="day-num">17</span><span>18</span><span>19</span></div>
            </div>
          </div>
          <div class="cal-actions">
            <button id="cancelDateBtn" class="cal-btn-cancel" type="button">Cancel</button>
            <button id="applyDateBtn" class="cal-btn-done" type="button">Done</button>
          </div>
        </div>
      </div>

      <div class="control-wrapper sort-control-wrapper">
        <button id="sortBtn" class="control-btn sort-btn" type="button">
          <span>SORT</span>
          <i id="sortIcon" class="fa-solid fa-chevron-down"></i>
        </button>

        <div id="sortPillsContainer" class="sort-pills-group hidden">
          <button id="pillTime" class="pill-btn" type="button">RECENT</button>
          <button id="pillCategory" class="pill-btn" type="button">VISITOR</button>
        </div>

        <div id="sortMenu" class="sort-popover hidden">
          <div class="sort-section">
            <button class="sort-option" data-type="time" data-val="RECENT" type="button">Recent</button>
            <button class="sort-option" data-type="time" data-val="PAST" type="button">Past</button>
          </div>
          <div class="sort-divider"></div>
          <div class="sort-section">
            <button class="sort-option" data-type="category" data-val="STUDENT" type="button">Student</button>
            <button class="sort-option" data-type="category" data-val="VISITOR" type="button">Visitor</button>
          </div>
        </div>
      </div>

      <div class="search-wrapper">
        <input type="text" id="auditSearchInput" class="search-input" placeholder="SEARCH" />
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
      </div>

    </div>

    <div class="audit-logs-card">
      <div class="log-item">
        <div class="log-left-col">
          <h3 class="nfc-number">NFC NUMBER</h3>
          <span class="log-date">DATE</span>
        </div>
        <div class="log-right-col">
          <div class="info-field"><span>NAME</span></div>
          <div class="info-field"><span>TYPE</span></div>
          <div class="info-field"><span>EMAIL</span></div>
          <div class="info-field"><span>TIME IN</span></div>
          <div class="info-field"><span>TIME OUT</span></div>
        </div>
      </div>

      <div class="log-item">
        <div class="log-left-col">
          <h3 class="nfc-number">NFC NUMBER</h3>
          <span class="log-date">DATE</span>
        </div>
        <div class="log-right-col">
          <div class="info-field"><span>NAME</span></div>
          <div class="info-field"><span>TYPE</span></div>
          <div class="info-field"><span>EMAIL</span></div>
          <div class="info-field"><span>TIME IN</span></div>
          <div class="info-field"><span>TIME OUT</span></div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button id="showLogsBtn" class="btn-account btn-blue" type="button">SHOW</button>
    </div>

  </div>

  <div class="floating-bot-widget">
    <i class="fa-solid fa-robot"></i>
  </div>

</section>

      <button class="ai-tappy-btn" aria-label="AI Tappy Assistant">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          
          <rect x="5" y="7" width="14" height="10" rx="3.5" stroke="#ffffff" stroke-width="2" fill="none"/>
         
          <path d="M12 4V7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="3" r="1.5" fill="#ffffff"/>
       
          <circle cx="9" cy="11" r="1.2" fill="#ffffff"/>
          <circle cx="15" cy="11" r="1.2" fill="#ffffff"/>
      
          <path d="M9.5 14C10 14.8 11 15.2 12 15.2C13 15.2 14 14.8 14.5 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
         
          <rect x="3" y="9.5" width="2" height="5" rx="1" fill="#ffffff"/>
          <rect x="19" y="9.5" width="2" height="5" rx="1" fill="#ffffff"/>
          <path d="M19 12C20.8 12 21.2 13 21.2 15C21.2 16.5 20.2 17 18.5 17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </main>

  
    <div id="aiTappyModal" class="ai-modal-container popout">
      <div class="ai-chat-wrapper">
        
       
        <div class="ai-chat-header">
          <h2 class="ai-title">ASK <strong>TAPPY</strong></h2>
          
          <div class="ai-header-controls">
          
              <button id="aiToggleSizeBtn" class="ai-ctrl-btn" type="button" aria-label="Resize window" title="Toggle Fullscreen / Pop-out">
                <svg class="resize-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
              </button>
              
              
              <button id="aiCloseBtn" class="ai-ctrl-btn ai-close-btn" type="button" aria-label="Close Assistant" title="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
        </div>

        
        <div class="ai-chat-box">
        </div>

        <div class="ai-input-row">
          <div class="ai-input-bar">
            <button class="ai-plus-btn" type="button" aria-label="Add Attachment">+</button>
            <input type="text" placeholder="Ask Tappy anything..." class="ai-input-field" />
            <button class="ai-mic-btn" type="button" aria-label="Voice Input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
          </div>   
      </div>
    </div>


    <button id="aiFloatingTrigger" class="ai-tappy-btn standalone-trigger" type="button" aria-label="Open AI Tappy">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="7" width="14" height="10" rx="3.5" stroke="#ffffff" stroke-width="2" fill="none"/>
        <path d="M12 4V7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="3" r="1.5" fill="#ffffff"/>
        <circle cx="9" cy="11" r="1.2" fill="#ffffff"/>
        <circle cx="15" cy="11" r="1.2" fill="#ffffff"/>
        <path d="M9.5 14C10 14.8 11 15.2 12 15.2C13 15.2 14 14.8 14.5 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="3" y="9.5" width="2" height="5" rx="1" fill="#ffffff"/>
        <rect x="19" y="9.5" width="2" height="5" rx="1" fill="#ffffff"/>
      </svg>
    </button>

    <button id="aiFloatingTrigger" class="ai-tappy-btn standalone-trigger" type="button" aria-label="Open AI Tappy">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="7" width="14" height="10" rx="3.5" stroke="#ffffff" stroke-width="2" fill="none"/>
        <path d="M12 4V7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="3" r="1.5" fill="#ffffff"/>
        <circle cx="9" cy="11" r="1.2" fill="#ffffff"/>
        <circle cx="15" cy="11" r="1.2" fill="#ffffff"/>
        <path d="M9.5 14C10 14.8 11 15.2 12 15.2C13 15.2 14 14.8 14.5 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="3" y="9.5" width="2" height="5" rx="1" fill="#ffffff"/>
        <rect x="19" y="9.5" width="2" height="5" rx="1" fill="#ffffff"/>
      </svg>
    </button>
  </section>
 
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const hamburgerBtn = document.querySelector('.hamburger-tab');
    const sidebar = document.querySelector('.sidebar');

    if (hamburgerBtn && sidebar) {
      const isExpanded = localStorage.getItem('sidebarState') === 'expanded';

      if (isExpanded) {
        sidebar.classList.add('expanded');
        hamburgerBtn.classList.add('active');
        document.body.classList.add('sidebar-expanded');
      }

      hamburgerBtn.addEventListener('click', () => {
        hamburgerBtn.classList.toggle('active');
        sidebar.classList.toggle('expanded');
        document.body.classList.toggle('sidebar-expanded');

        if (sidebar.classList.contains('expanded')) {
          localStorage.setItem('sidebarState', 'expanded');
        } else {
          localStorage.setItem('sidebarState', 'collapsed');
        }
      });
    }
  });


  document.addEventListener('DOMContentLoaded', () => {
    const lightBtn = document.getElementById('lightMode');
    const darkBtn = document.getElementById('darkMode');

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      if (lightBtn && darkBtn) {
        lightBtn.classList.remove('active');
        darkBtn.classList.add('active');
      }
    }

    if (lightBtn) {
      lightBtn.addEventListener('click', () => {
        document.body.classList.remove('dark-mode');
        lightBtn.classList.add('active');
        darkBtn.classList.remove('active');
        localStorage.setItem('theme', 'light');
      });
    }

    if (darkBtn) {
      darkBtn.addEventListener('click', () => {
        document.body.classList.add('dark-mode');
        darkBtn.classList.add('active');
        lightBtn.classList.remove('active');
        localStorage.setItem('theme', 'dark');
      });
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const aiTappyBtn = document.querySelector('.ai-tappy-btn');
    const aiModal = document.getElementById('aiTappyModal');

    if (aiTappyBtn && aiModal) {
      aiTappyBtn.addEventListener('click', () => {
        aiModal.classList.toggle('active');
      });
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const aiModal = document.getElementById('aiTappyModal');
    const floatingTrigger = document.getElementById('aiFloatingTrigger');
    const innerLauncher = document.getElementById('aiTappyLauncher');
    const closeBtn = document.getElementById('aiCloseBtn');
    const toggleSizeBtn = document.getElementById('aiToggleSizeBtn');

    function toggleAiModal() {
      if (aiModal) {
        aiModal.classList.toggle('active');
      }
    }

    if (floatingTrigger) floatingTrigger.addEventListener('click', toggleAiModal);
    if (closeBtn) closeBtn.addEventListener('click', () => aiModal.classList.remove('active'));

    if (innerLauncher) {
      innerLauncher.addEventListener('click', () => {
        console.log('Tappy clicked inside input bar!');
      });
    }

    if (toggleSizeBtn && aiModal) {
      toggleSizeBtn.addEventListener('click', () => {
        if (aiModal.classList.contains('popout')) {
          aiModal.classList.remove('popout');
          aiModal.classList.add('fullscreen');
        } else {
          aiModal.classList.remove('fullscreen');
          aiModal.classList.add('popout');
        }
      });
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const editAccountBtn = document.getElementById('editAccountBtn');
    const saveAccountBtn = document.getElementById('saveAccountBtn');
    const accountInputs = document.querySelectorAll('.account-input');

    if (editAccountBtn) {
      editAccountBtn.addEventListener('click', () => {
        accountInputs.forEach(input => input.removeAttribute('disabled'));
        if (accountInputs[0]) accountInputs[0].focus();
      });
    }

    if (saveAccountBtn) {
      saveAccountBtn.addEventListener('click', () => {
        accountInputs.forEach(input => input.setAttribute('disabled', 'true'));
      });
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
  const dateBtn = document.getElementById('dateBtn');
  const dateBtnText = document.getElementById('dateBtnText');
  const calendarPopover = document.getElementById('calendarPopover');
  const cancelDateBtn = document.getElementById('cancelDateBtn');
  const applyDateBtn = document.getElementById('applyDateBtn');
  const dateRangeInput = document.getElementById('dateRangeInput');
  const calMonthSelect = document.getElementById('calMonthSelect');
  const calYearSelect = document.getElementById('calYearSelect');
  const calDaysMock = document.querySelector('.cal-days-mock');

  const sortBtn = document.getElementById('sortBtn');
  const sortMenu = document.getElementById('sortMenu');
  const sortPillsContainer = document.getElementById('sortPillsContainer');
  const pillTime = document.getElementById('pillTime');
  const pillCategory = document.getElementById('pillCategory');
  const showLogsBtn = document.getElementById('showLogsBtn');

  const monthNamesShort = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  let selectedMonthIndex = calMonthSelect ? parseInt(calMonthSelect.value) : 9; // Default October (9)
  let selectedYear = calYearSelect ? parseInt(calYearSelect.value) : 2026;

  let startDateVal = 14;
  let endDateVal = 17;

  let selectedTimeVal = null;
  let selectedCategoryVal = null;

  function renderCalendar() {
    if (!calDaysMock) return;

    calDaysMock.innerHTML = `
      <div class="cal-row header">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
    `;

    const firstDayIndex = new Date(selectedYear, selectedMonthIndex, 1).getDay();
    const totalDays = new Date(selectedYear, selectedMonthIndex + 1, 0).getDate();
    const prevLastDay = new Date(selectedYear, selectedMonthIndex, 0).getDate();

    let daysArray = [];

    for (let i = firstDayIndex - 1; i >= 0; i--) {
      daysArray.push({ day: prevLastDay - i, isCurrentMonth: false });
    }

    for (let d = 1; d <= totalDays; d++) {
      daysArray.push({ day: d, isCurrentMonth: true });
    }

    const remainingCells = (7 - (daysArray.length % 7)) % 7;
    for (let n = 1; n <= remainingCells; n++) {
      daysArray.push({ day: n, isCurrentMonth: false });
    }

    let rowDiv = document.createElement('div');
    rowDiv.className = 'cal-row';

    daysArray.forEach((item, index) => {
      const span = document.createElement('span');
      span.textContent = item.day;

      if (!item.isCurrentMonth) {
        span.style.color = '#cbd5e1';
        span.style.cursor = 'default';
      } else {
        span.classList.add('day-num');

        if (startDateVal && endDateVal) {
          let start = Math.min(startDateVal, endDateVal);
          let end = Math.max(startDateVal, endDateVal);
          if (item.day === start || item.day === end) {
            span.classList.add('active-date');
          } else if (item.day > start && item.day < end) {
            span.classList.add('selected-range');
          }
        } else if (startDateVal && item.day === startDateVal) {
          span.classList.add('active-date');
        }

        span.addEventListener('click', (e) => {
          e.stopPropagation();

          if (!startDateVal || (startDateVal && endDateVal)) {
            startDateVal = item.day;
            endDateVal = null;
          } else {
            endDateVal = item.day;
          }

          renderCalendar();
          updateRangeInputText();
        });
      }

      rowDiv.appendChild(span);

      if ((index + 1) % 7 === 0 || index === daysArray.length - 1) {
        calDaysMock.appendChild(rowDiv);
        if (index < daysArray.length - 1) {
          rowDiv = document.createElement('div');
          rowDiv.className = 'cal-row';
        }
      }
    });
  }

  function updateRangeInputText() {
    if (!dateRangeInput) return;
    const monthStr = monthNamesShort[selectedMonthIndex];
    if (startDateVal && endDateVal) {
      let start = Math.min(startDateVal, endDateVal);
      let end = Math.max(startDateVal, endDateVal);
      dateRangeInput.value = `${start} ${monthStr} ${selectedYear} - ${end} ${monthStr} ${selectedYear}`;
    } else if (startDateVal) {
      dateRangeInput.value = `${startDateVal} ${monthStr} ${selectedYear}`;
    }
  }

  if (calMonthSelect) {
    calMonthSelect.addEventListener('change', (e) => {
      selectedMonthIndex = parseInt(e.target.value);
      startDateVal = null;
      endDateVal = null;
      renderCalendar();
      updateRangeInputText();
    });
  }

  if (calYearSelect) {
    calYearSelect.addEventListener('change', (e) => {
      selectedYear = parseInt(e.target.value);
      startDateVal = null;
      endDateVal = null;
      renderCalendar();
      updateRangeInputText();
    });
  }

  dateBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    calendarPopover.classList.toggle('hidden');
    sortMenu.classList.add('hidden');
  });

  cancelDateBtn.addEventListener('click', () => {
    calendarPopover.classList.add('hidden');
  });

  applyDateBtn.addEventListener('click', () => {
    if (dateRangeInput && dateRangeInput.value) {
      dateBtnText.textContent = dateRangeInput.value;
    }
    calendarPopover.classList.add('hidden');
  });

  sortBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sortMenu.classList.toggle('hidden');
    calendarPopover.classList.add('hidden');
  });

  const sortOptions = document.querySelectorAll('.sort-option');
  sortOptions.forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      const type = opt.getAttribute('data-type');
      const val = opt.getAttribute('data-val');

      document.querySelectorAll(`.sort-option[data-type="${type}"]`).forEach(el => el.classList.remove('active'));
      opt.classList.add('active');

      if (type === 'time') {
        selectedTimeVal = val;
      } else if (type === 'category') {
        selectedCategoryVal = val;
      }
    });
  });

  showLogsBtn.addEventListener('click', () => {
    if (dateRangeInput && dateRangeInput.value) {
      dateBtnText.textContent = dateRangeInput.value;
    }

    if (selectedTimeVal) {
      pillTime.textContent = selectedTimeVal;
    }
    if (selectedCategoryVal) {
      pillCategory.textContent = selectedCategoryVal;
    }

    if (selectedTimeVal || selectedCategoryVal) {
      sortBtn.classList.add('hidden');
      sortPillsContainer.classList.remove('hidden');
    }

    sortMenu.classList.add('hidden');
    calendarPopover.classList.add('hidden');
  });

  [pillTime, pillCategory].forEach(pill => {
    pill.addEventListener('click', (e) => {
      e.stopPropagation();
      sortMenu.classList.toggle('hidden');
      calendarPopover.classList.add('hidden');
    });
  });

  document.addEventListener('click', (e) => {
    if (!calendarPopover.contains(e.target) && !dateBtn.contains(e.target)) {
      calendarPopover.classList.add('hidden');
    }
    if (!sortMenu.contains(e.target) && !sortBtn.contains(e.target) && !sortPillsContainer.contains(e.target)) {
      sortMenu.classList.add('hidden');
    }
  });

  renderCalendar();
  updateRangeInputText();
});

</script>
</body>
</html>
