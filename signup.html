<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPIN</title>
  <link rel="stylesheet" href="design.css" />
</head>
<body>
 
 <section id="signup" class="form-page page-section">
      <div class="center-form">
        <h2>CREATE YOUR ACCOUNT</h2>
        <p class="switch-copy">Already have an account? <a href="login.html">Sign In</a></p>
        <form class="signup-grid">
          <input placeholder="First Name" />
          <input placeholder="Middle Name" />
          <input placeholder="Last Name" />
          <input type="email" placeholder="Email" />
          <input class="full" type="password" placeholder="Password" />
          <input class="full" type="password" placeholder="Confirm Password" />
          <button class="primary-btn full" type="button">Sign Up</button>
        </form>
      </div>
    </section>
</body>
</html>
