<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPIN</title>
  <link rel="stylesheet" href="design.css" />
</head>
<body>

  <main class="form-page">
    <section id="login" class="auth-page page-section">
      <div class="auth-login">
        <div class="auth-form">
          <h1 style="text-align: center;">LOG IN TO YOUR ACCOUNT</h1>
          <form>
            <label class="sr-only" for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="Email" />
            <label class="sr-only" for="login-password">Password</label>
            <div class="password-field"><input id="login-password" type="password" placeholder="Password"/></div>
            <a class="tiny-link left-link" href="forgot.html">Forgot Password?</a>
            <button class="primary-btn" type="button">Sign In</button>
            <p class="switch-copy">Don't have an account? <a href="signup.html">Sign Up</a></p>
          </form>
        </div>
      </div>

      <aside class="auth-brand-panel">
        <img src="TAPIN Logo.png" alt="TAPIN Logo" class="tapin-logo-img" />
      </aside>
    </section>
  </main>
</body>
</html>
